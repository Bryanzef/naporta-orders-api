services:
  postgres:
    image: postgres:16-alpine
    container_name: naporta_postgres
    restart: unless-stopped
    ports:
      - '5435:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-naporta}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-naporta123}
      POSTGRES_DB: ${DB_NAME:-naporta_orders}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-naporta} -d ${DB_NAME:-naporta_orders}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: development
    container_name: naporta_api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-naporta}:${DB_PASSWORD:-naporta123}@postgres:5432/${DB_NAME:-naporta_orders}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run start:dev"

volumes:
  postgres_data:
